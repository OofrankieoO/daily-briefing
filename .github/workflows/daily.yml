name: 每日热点简报

# 【已停止自动运行】2026-11-02
# 原来的定时触发（GitHub cron 按 UTC 解释，北京时间每天 08:00 = UTC 00:00）
# 已被注释掉，工作流不会再自己跑。要恢复，取消下面两行注释并 push 即可。
on:
  # schedule:
  #   - cron: "0 0 * * *"
  workflow_dispatch: # 仅保留手动触发：Actions 页面点 Run workflow 才会运行

# push 回仓库需要写权限（GITHUB_TOKEN 默认只读）
permissions:
  contents: write

# 避免上一次还没跑完、这一次又启动
concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    env:
      # 影响 date 命令和脚本里的本地时间，保证提交信息里的日期是北京时间
      TZ: Asia/Shanghai
    steps:
      - name: 检出仓库
        uses: actions/checkout@v5

      - name: 安装 Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 生成简报
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python main.py

      - name: 提交并推送 reports/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "reports/ 没有变化，跳过提交"
            exit 0
          fi
          git commit -m "briefing: $(date +%F)"
          git push
